# Example only: requires an Ingress controller such as AWS Load Balancer Controller.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gatnet
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gatnet
                port:
                  number: 80
