apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatnet
  labels:
    app: gatnet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gatnet
  template:
    metadata:
      labels:
        app: gatnet
    spec:
      containers:
        - name: gatnet
          image: YOUR_DOCKER_REGISTRY/gatnet:1.0.0
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gatnet
spec:
  selector:
    app: gatnet
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
